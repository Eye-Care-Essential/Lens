name: Windows release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the Windows build (for example 1.0.0)"
        required: true
        default: "0.0.0"
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app and build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller pytest

      - name: Run acceptance tests
        run: python -m pytest -q

      - name: Build the onedir app
        run: python -m PyInstaller --noconfirm --clean pricelens.spec

      - name: Set release version
        id: version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          switch ($env:GITHUB_EVENT_NAME) {
            "push" { $version = $env:GITHUB_REF_NAME -creplace '^v', '' }
            "workflow_dispatch" { $version = $env:MANUAL_VERSION -creplace '^v', '' }
            default { $version = "0.0.0" }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Version must look like 1.2.3. Received: $version"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\PriceLens" -DestinationPath "dist\PriceLens-portable-v$env:APP_VERSION.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build setup executable
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found at $compiler" }
          & $compiler "/DAppVersion=$env:APP_VERSION" "installer\pricelens.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Smoke test portable ZIP and installed app
        shell: pwsh
        run: |
          # Launch from the packaged runtime without Python on PATH.
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'python|conda' }) -join ';'
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue

          function Test-PriceLensStart([string]$Directory) {
            $executable = Join-Path $Directory "PriceLens.exe"
            if (-not (Test-Path $executable)) { throw "Missing packaged executable: $executable" }
            Set-Content -Path (Join-Path $Directory "config.json") -Value '{}' -Encoding ascii
            $process = Start-Process -FilePath $executable -WorkingDirectory $Directory -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(30)
              do {
                $process.Refresh()
                if ($process.HasExited) { throw "PriceLens exited during startup with code $($process.ExitCode)" }
                if ($process.MainWindowTitle -eq "PriceLens" -and $process.Responding) { return }
                Start-Sleep -Milliseconds 500
              } while ((Get-Date) -lt $deadline)
              throw "PriceLens did not open a responsive main window. Window title: $($process.MainWindowTitle)"
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "PriceLens-portable-smoke"
          Expand-Archive -LiteralPath "dist\PriceLens-portable-v$env:APP_VERSION.zip" -DestinationPath $extractDir
          Test-PriceLensStart (Join-Path $extractDir "PriceLens")

          $setup = "dist\PriceLens-Setup-v$env:APP_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "PriceLens-installed-smoke"
          $setupArguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="{0}"' -f $installDir
          $installer = Start-Process -FilePath $setup -ArgumentList $setupArguments -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Silent setup failed with exit code $($installer.ExitCode)" }
          Test-PriceLensStart $installDir

      - name: Report package sizes
        shell: pwsh
        run: |
          $packages = Get-Item -LiteralPath @(
            "dist\PriceLens-portable-v$env:APP_VERSION.zip",
            "dist\PriceLens-Setup-v$env:APP_VERSION.exe"
          )
          "### Windows package sizes" >> $env:GITHUB_STEP_SUMMARY
          foreach ($package in $packages) {
            $line = "- {0}: {1:N1} MiB ({2} bytes)" -f $package.Name, ($package.Length / 1MB), $package.Length
            Write-Host $line
            $line >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: PriceLens-Windows-v${{ env.APP_VERSION }}
          path: |
            dist/PriceLens-portable-v${{ env.APP_VERSION }}.zip
            dist/PriceLens-Setup-v${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: PriceLens-Windows-v${{ env.APP_VERSION }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PriceLens v${{ env.APP_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PriceLens-portable-v${{ env.APP_VERSION }}.zip
            dist/PriceLens-Setup-v${{ env.APP_VERSION }}.exe

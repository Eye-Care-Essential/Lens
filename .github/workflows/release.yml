name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the Windows build (for example 1.0.0)"
        required: true
        default: "0.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app and build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller pytest

      - name: Run acceptance tests
        run: python -m pytest -q

      - name: Build the onedir app
        run: python -m PyInstaller --noconfirm --clean pricelens.spec

      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = "${{ inputs.version }}".TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Version must look like 1.2.3. Received: $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\PriceLens" -DestinationPath "dist\PriceLens-portable-v$env:APP_VERSION.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build setup executable
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found at $compiler" }
          & $compiler "/DAppVersion=$env:APP_VERSION" "installer\pricelens.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Smoke test portable executable
        shell: pwsh
        run: |
          function Test-PriceLensStart([string]$Executable, [string]$WorkingDirectory) {
            $config = '{"ai":{"provider":"gemini","gemini":{"api_key":"","model":"gemini-3.8-flash"}},"camera":{"device_id":"","resolution":"1280x720"},"detection":{"auto_enabled":false}}'
            Set-Content -Path (Join-Path $WorkingDirectory "config.json") -Value $config -Encoding ascii
            $process = Start-Process -FilePath $Executable -WorkingDirectory $WorkingDirectory -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "PriceLens exited during startup with code $($process.ExitCode)" }
            Stop-Process -Id $process.Id -Force
          }
          $portableDir = Join-Path $env:RUNNER_TEMP "PriceLens-portable-smoke"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item -Path "dist\PriceLens\*" -Destination $portableDir -Recurse -Force
          Test-PriceLensStart (Join-Path $portableDir "PriceLens.exe") $portableDir

      - name: Smoke test installed executable
        shell: pwsh
        run: |
          $setup = "dist\PriceLens-Setup-v$env:APP_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "PriceLens-installed-smoke"
          $installer = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Silent setup failed with exit code $($installer.ExitCode)" }
          $config = '{"ai":{"provider":"gemini","gemini":{"api_key":"","model":"gemini-3.8-flash"}},"camera":{"device_id":"","resolution":"1280x720"},"detection":{"auto_enabled":false}}'
          Set-Content -Path (Join-Path $installDir "config.json") -Value $config -Encoding ascii
          $process = Start-Process -FilePath (Join-Path $installDir "PriceLens.exe") -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Installed PriceLens exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Upload manual build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PriceLens-Windows-v${{ env.APP_VERSION }}
          path: |
            dist/PriceLens-portable-v${{ env.APP_VERSION }}.zip
            dist/PriceLens-Setup-v${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PriceLens v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            dist/PriceLens-portable-v${{ env.APP_VERSION }}.zip
            dist/PriceLens-Setup-v${{ env.APP_VERSION }}.exe
